# Локально: сервер + PostgreSQL. MinIO включается профилем s3.
services:
  server:
    build: .
    ports:
      - "${BIND_ADDR:-127.0.0.1}:8080:8080"
    environment:
      LISTEN_ADDR: ":8080"
      STORE: postgres
      DATABASE_URL: "postgres://${POSTGRES_USER:-umbra}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-umbra}?sslmode=disable"
      TOKEN_TTL_SECONDS: "${TOKEN_TTL_SECONDS:-2592000}"
      ALLOW_LEGACY_AUTH: "${ALLOW_LEGACY_AUTH:-false}"
      TRUSTED_PROXIES: "${TRUSTED_PROXIES:-}"
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"
      TELEGRAM_CHAT_ID: "${TELEGRAM_CHAT_ID:-0}"
      TELEGRAM_API_BASE: "${TELEGRAM_API_BASE:-}"
      TELEGRAM_API_KEY: "${TELEGRAM_API_KEY:-}"
      MAX_MESSAGE_BYTES: "${MAX_MESSAGE_BYTES:-2097152}"
      BLOB_DIR: /data/blobs
      MAX_MEDIA_BYTES: "${MAX_MEDIA_BYTES:-52428800}"
      MAX_USER_MEDIA_BYTES: "${MAX_USER_MEDIA_BYTES:-1073741824}"
      # Переключение на S3: задайте BLOB_STORE_TYPE=s3 в .env.
      BLOB_STORE_TYPE: "${BLOB_STORE_TYPE:-file}"
      S3_ENDPOINT: "${S3_ENDPOINT:-minio:9000}"
      S3_ACCESS_KEY: "${S3_ACCESS_KEY:-umbra}"
      S3_SECRET_KEY: "${S3_SECRET_KEY:-}"
      S3_BUCKET: "${S3_BUCKET:-umbra-media}"
      S3_REGION: "${S3_REGION:-us-east-1}"
      S3_USE_SSL: "${S3_USE_SSL:-false}"
      # Звонки: ICE-серверы. Клиент забирает их через GET /v1/turn.
      STUN_URL: "${STUN_URL:-stun:stun.l.google.com:19302}"
      TURN_URL: "${TURN_URL:-}"
      TURN_SECRET: "${TURN_SECRET:-}"
      TURN_TTL_SECONDS: "${TURN_TTL_SECONDS:-3600}"
      # Push-уведомления Firebase. Без ключа сервер работает, но не будит телефоны.
      FCM_CREDENTIALS_FILE: "${FCM_CREDENTIALS_FILE:-}"
      FCM_PROJECT_ID: "${FCM_PROJECT_ID:-}"
    volumes:
      - blobdata:/data/blobs
      # Ключ сервисного аккаунта Firebase: положите файл рядом с compose,
      # раскомментируйте строку и задайте FCM_CREDENTIALS_FILE=/run/secrets/fcm.json
      # - ./fcm-service-account.json:/run/secrets/fcm.json:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-umbra}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
      POSTGRES_DB: "${POSTGRES_DB:-umbra}"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # TURN-ретранслятор для звонков: docker compose --profile turn up -d coturn.
  # Ему нужен весь диапазон relay-портов, поэтому сеть — host.
  coturn:
    profiles: [turn]
    image: coturn/coturn:4.6
    network_mode: host
    command:
      - -n
      - --log-file=stdout
      - --realm=${TURN_REALM:-turn.example.com}
      - --listening-port=3478
      - --tls-listening-port=5349
      - --min-port=49160
      - --max-port=49200
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET:?Set TURN_SECRET in .env}
      - --external-ip=${TURN_PUBLIC_IP:?Set TURN_PUBLIC_IP in .env}
      - --no-multicast-peers
      - --no-cli
      - --no-tlsv1
      - --no-tlsv1_1
    restart: unless-stopped

  minio:
    profiles: [s3]
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${S3_ACCESS_KEY:-umbra}"
      MINIO_ROOT_PASSWORD: "${S3_SECRET_KEY:-}"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
  blobdata:
  miniodata:
