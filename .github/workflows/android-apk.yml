name: Android APK (debug)

# Собирает debug-APK при изменении Android-кода на ветке main.
# Артефакт (umbra-apk-debug) доступен на странице прогона Actions 60 дней;
# теги/релизы не создаются — в репозитории остаётся одна ветка main.
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:
    inputs:
      serverUrl:
        description: 'Адрес сервера Umbra, вшиваемый в APK (BuildConfig.SERVER_URL)'
        required: false
        default: 'http://194.226.126.253:8081'

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Accept SDK licenses and install NDK (стриппинг .so)
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "ndk;26.1.10909125" >/dev/null

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: android
        env:
          UMBRA_SERVER_URL: ${{ inputs.serverUrl || 'http://194.226.126.253:8081' }}
        run: |
          chmod +x gradlew
          # Раннер GH: 16 ГБ RAM — поднимаем heap (в репозитории дефолт под слабые машины,
          # иначе packageDebug падает с OOM на нестрипанных libsignal_jni.so ×3 ABI).
          sed -i 's/-Xmx1280m/-Xmx5g/g; s/MaxMetaspaceSize=512m/MaxMetaspaceSize=1g/' gradle.properties
          ./gradlew assembleDebug -Pumbra.serverUrl="$UMBRA_SERVER_URL" --stacktrace

      - name: Prepare artifact
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk umbra-debug.apk
          sha256sum umbra-debug.apk | tee umbra-debug.apk.sha256
          ls -la umbra-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: umbra-apk-debug
          path: |
            umbra-debug.apk
            umbra-debug.apk.sha256
          retention-days: 60
