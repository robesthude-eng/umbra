name: Android APK (подписанный, debug)

# Собирает подписанный debug-APK на push в main при изменении Android-кода.
# Подпись — стабильный ключ из секретов: новый APK ОБНОВЛЯЕТ установленное
# приложение (без удаления). Артефакт umbra-apk-debug доступен со страницы
# Actions 60 дней; теги/релизы не создаются (одна ветка main).
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:
    inputs:
      serverUrl:
        description: 'Адрес сервера Umbra, вшиваемый в APK (BuildConfig.SERVER_URL)'
        required: false
        default: 'http://194.226.126.253:8081'

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Accept SDK licenses and install SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;34.0.0" "platform-tools"

      # Стабильная подпись: APK из CI подписываются постоянным ключом (секреты),
      # поэтому новые сборки ОБНОВЛЯЮТ установленное приложение без удаления.
      # Если секретов нет — сборка падает с понятной ошибкой, а не публикует
      # APK с временным debug-ключом.
      - name: Decode signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.UMBRA_SIGNING_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.UMBRA_SIGNING_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.UMBRA_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.UMBRA_SIGNING_KEY_PASSWORD }}
        run: |
          if [ -z "${KEYSTORE_B64}" ] || [ -z "${KEYSTORE_PASSWORD}" ] || [ -z "${KEY_ALIAS}" ] || [ -z "${KEY_PASSWORD}" ]; then
            echo "::error::Секреты подписи UMBRA_SIGNING_* не заданы. Без них APK подпишется временным ключом и не обновит установленное приложение."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/umbra-signing"
          echo "${KEYSTORE_B64}" | base64 -d > "$RUNNER_TEMP/umbra-signing/umbra.keystore"
          echo "UMBRA_SIGNING_KEYSTORE=$RUNNER_TEMP/umbra-signing/umbra.keystore" >> "$GITHUB_ENV"
          echo "UMBRA_SIGNING_KEYSTORE_PASSWORD=${KEYSTORE_PASSWORD}" >> "$GITHUB_ENV"
          echo "UMBRA_SIGNING_KEY_ALIAS=${KEY_ALIAS}" >> "$GITHUB_ENV"
          echo "UMBRA_SIGNING_KEY_PASSWORD=${KEY_PASSWORD}" >> "$GITHUB_ENV"
          echo "Keystore для подписи загружен."

      - name: Build debug APK
        working-directory: android
        env:
          UMBRA_SERVER_URL: ${{ inputs.serverUrl || 'http://194.226.126.253:8081' }}
        run: |
          chmod +x gradlew
          # Раннер GH: 16 ГБ RAM — поднимаем heap (дефолт в репозитории под слабые машины).
          sed -i 's/-Xmx1280m/-Xmx5g/g; s/MaxMetaspaceSize=512m/MaxMetaspaceSize=1g/' gradle.properties
          ./gradlew assembleDebug -Pumbra.serverUrl="$UMBRA_SERVER_URL" --stacktrace

      - name: Prepare artifact
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk umbra-debug.apk
          sha256sum umbra-debug.apk | tee umbra-debug.apk.sha256
          ls -la umbra-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: umbra-apk-debug
          path: |
            umbra-debug.apk
            umbra-debug.apk.sha256
          retention-days: 60
