name: Project checks
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: umbra_test
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: umbra_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U umbra_test -d umbra_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://umbra_test:test_password@127.0.0.1:5432/umbra_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - name: Check reachable Go vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          govulncheck ./...

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Accept SDK licenses and install SDK components
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          ZIP=/tmp/commandlinetools.zip
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-16111833_latest.zip -o "$ZIP"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          rm -rf "$SDK_ROOT/cmdline-tools/_new" "$SDK_ROOT/cmdline-tools/latest"
          unzip -q "$ZIP" -d "$SDK_ROOT/cmdline-tools/_new"
          mv "$SDK_ROOT/cmdline-tools/_new/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
          rm -rf "$SDK_ROOT/cmdline-tools/_new"
          SDKM="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          "$SDKM" "platforms;android-37.0" "build-tools;34.0.0"
      # Компиляция app + androidTest и lint. Инструментальные тесты на эмуляторе
      # здесь не гоняются: устройство есть у владельца (проверка вручную).
      - name: Build and lint
        working-directory: android
        run: |
          chmod +x gradlew
          # Heap под раннер GH (дефолт в репозитории под слабые машины).
          sed -i 's/-Xmx1280m/-Xmx5g/g; s/MaxMetaspaceSize=512m/MaxMetaspaceSize=1g/' gradle.properties
          ./gradlew assembleDebug assembleDebugAndroidTest lintDebug --stacktrace
      - name: Upload lint report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: android/app/build/intermediates/lint_intermediate_text_report/
          retention-days: 7
          if-no-files-found: ignore

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Scan files and history for secrets
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          gitleaks dir --redact --no-banner .
          gitleaks git --redact --no-banner .
